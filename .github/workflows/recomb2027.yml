name: RECOMB revision
on:
  push:
    branches: [recomb-theory-revision]
  pull_request:
    paths: ['recomb2027/**', '.github/workflows/recomb2027.yml']
permissions:
  contents: read
jobs:
  scoped-certificates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install numpy pandas pyarrow
      - run: unzip -q recomb2027/GeoCert_RECOMB_Revision_0.2.0a2.zip -d unpacked
      - name: Verify frozen source and tests
        working-directory: unpacked/GeoCert_RECOMB_Revision
        run: |
          python validation/replay.py --cpp --output run/revision_replay.json
          python tests/test_proseg.py
          python experiments/joint_assignment_audit_verify.py
