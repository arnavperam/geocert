name: Atlas merged revision

on:
  push:
    paths:
      - 'atlas2027/**'
      - '.github/workflows/atlas2027.yml'
  pull_request:
    paths:
      - 'atlas2027/**'
      - '.github/workflows/atlas2027.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify archive parts and extract complete inputs
        run: >-
          python atlas2027/reassemble.py
          --output "${{ runner.temp }}/GeoCert_Atlas_Merged_0.3.0a2.zip"
          --extract "${{ runner.temp }}/atlas-replay"
      - name: Install analysis dependencies
        working-directory: ${{ runner.temp }}/atlas-replay/GeoCert_Atlas_Merged_0.3.0a2
        run: python -m pip install -r requirements-analysis.txt
      - name: Match browsable scientific code to archived code
        env:
          ATLAS_PACKAGE: ${{ runner.temp }}/atlas-replay/GeoCert_Atlas_Merged_0.3.0a2
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          public = Path('atlas2027')
          package = Path(os.environ['ATLAS_PACKAGE'])
          paths = [Path('atlas_cli.py'), Path('requirements-analysis.txt'), Path('VERSION')]
          for directory in ['atlas', 'geocert_expression', 'analysis', 'tests']:
              paths += [p.relative_to(public) for p in (public / directory).rglob('*.py')]
          for path in paths:
              if (public / path).read_bytes() != (package / path).read_bytes():
                  raise ValueError(f'browsable/archive source mismatch: {path}')
          print(f'Matched {len(paths)} scientific source and environment files')
          PY
      - name: Verify package and algorithm contracts
        working-directory: ${{ runner.temp }}/atlas-replay/GeoCert_Atlas_Merged_0.3.0a2
        run: |
          python atlas_cli.py verify-manifest
          python atlas_cli.py validate
          python tests/test_proseg.py
          python atlas_cli.py showcase --output run/ci-showcase.json
      - name: Recompute every baseline exact spectrum and interval
        working-directory: ${{ runner.temp }}/atlas-replay/GeoCert_Atlas_Merged_0.3.0a2
        run: |
          python atlas_cli.py reproduce --dataset lung --output-dir run/ci-lung
          python atlas_cli.py reproduce --dataset breast --output-dir run/ci-breast
      - name: Check saved width-study mappings and witnesses
        working-directory: ${{ runner.temp }}/atlas-replay/GeoCert_Atlas_Merged_0.3.0a2
        run: python analysis/reach_independent_check.py
