name: Proseg output diagnostics
on:
  push:
    branches: [research/global-patch-certificates]
    paths: ['.github/workflows/proseg-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect completed outputs
        run: python evaluation/inspect_proseg_outputs.py
      - name: Rebuild the same published version
        run: |
          cargo install --locked --version 3.2.0 --bin proseg --jobs 2 proseg
      - name: Capture failed-command diagnostics
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,time,shutil,os
          root=pathlib.Path.cwd(); out=root/'results/proseg_locked'
          rec=json.loads((out/'run_record.json').read_text());results=[]
          for r in rec['runs']:
              if r['returncode']==0:continue
              folder=out/(r['roi']+'_'+r['mode']+'_retry');folder.mkdir(exist_ok=True)
              cmd=list(r['command']);cmd[0]=shutil.which('proseg');cmd[-1]=str(out/(r['roi']+'_input.csv.gz'))
              t=time.monotonic()
              p=subprocess.run(cmd,cwd=folder,text=True,capture_output=True,timeout=900,env=dict(os.environ,RUST_BACKTRACE='1'))
              results.append({'roi':r['roi'],'mode':r['mode'],'returncode':p.returncode,'seconds':time.monotonic()-t,'stdout':p.stdout,'stderr':p.stderr,'command':cmd})
              shutil.rmtree(folder/'spatial.zarr',ignore_errors=True)
          (out/'failure_diagnostics.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
      - name: Preserve diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/proseg_locked
          if ! git diff --cached --quiet; then
            git commit -m 'Record Proseg output schema and repeated startup diagnostics'
            git push origin HEAD:research/global-patch-certificates
          fi
