name: External transfer check

on:
  push:
    branches: [evaluation/breast-transfer]
    paths:
      - 'evaluation/*.py'
      - '.github/workflows/external-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: /tmp/geocert-breast-2fov.zip
          key: breast-2fov-4632914eca973a1d532231ea646e10cc
      - name: Install data readers
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 pyarrow==20.0.0 zarr==2.18.7 numcodecs==0.15.1
      - name: Download using the vendor's documented client
        run: |
          if [ ! -f /tmp/geocert-breast-2fov.zip ]; then
            curl --fail --location --max-time 180 --output /tmp/geocert-breast-2fov.zip https://cf.10xgenomics.com/samples/xenium/2.0.0/Xenium_V1_human_Breast_2fov/Xenium_V1_human_Breast_2fov_outs.zip || { rm -f /tmp/geocert-breast-2fov.zip; exit 1; }
          fi
      - name: Inspect the fixed source
        run: python evaluation/inspect_external.py
      - name: Run extraction and analysis when present
        run: |
          if [ -f evaluation/run_external.py ]; then
            python evaluation/run_external.py
          fi
      - name: Retain completed records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evaluation/results
          if ! git diff --cached --quiet; then
            git commit -m 'Record external transfer-check outputs'
            git push origin HEAD:evaluation/breast-transfer
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: external-transfer-inputs
          path: |
            run/external
            evaluation/results
          retention-days: 7
