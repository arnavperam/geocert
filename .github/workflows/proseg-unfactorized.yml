name: Proseg small-crop amendment
on:
  push:
    branches: [research/global-patch-certificates]
    paths: ['.github/workflows/proseg-unfactorized.yml', 'evaluation/run_proseg_unfactorized.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install unchanged published version
        run: cargo install --locked --version 3.2.0 --bin proseg --jobs 2 proseg
      - name: Run amendment
        run: python evaluation/run_proseg_unfactorized.py
      - name: Save outcomes
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/proseg_unfactorized
          if ! git diff --cached --quiet; then
            git commit -m 'Record both-crop unfactorized Proseg outcomes'
            git pull --rebase origin research/global-patch-certificates
            git push origin HEAD:research/global-patch-certificates
          fi
