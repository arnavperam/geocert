name: Check

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'data/**'
      - 'tests/**'
      - 'geocert.py'
      - '.github/workflows/check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check scientific artifact
        shell: bash
        run: |
          if [ ! -f geocert.py ]; then
            echo 'Source import is not present in this commit.'
            exit 0
          fi
          python geocert.py verify-manifest
          python tests/test_scc.py
          python tests/test_prefix_bound.py
          python geocert.py showcase --output run/showcase.json
          python geocert.py benchmark --repetitions 1 --scc --output-dir run/comparison
