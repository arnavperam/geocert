name: Check

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'data/**'
      - 'tests/**'
      - 'experiments/**'
      - 'results/readout/**'
      - 'geocert.py'
      - 'SHA256SUMS.txt'
      - '.github/workflows/check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check scientific artifact
        run: |
          python geocert.py verify-manifest
          python tests/test_scc.py
          python tests/test_prefix_bound.py
          python geocert.py showcase --output run/showcase.json
          python geocert.py benchmark --repetitions 1 --scc --output-dir run/comparison

          python experiments/readout_audit.py --output-dir run/readout
          python experiments/independent_showcase.py . run/independent_showcase.json
          python -c "import json; assert json.load(open('run/readout/readout_audit.json')) == json.load(open('results/readout/readout_audit.json'))"

  source-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pyarrow
      - name: Rebuild and verify source-count inputs
        run: |
          python experiments/build_readout_inputs.py --source-root . --output run/readout_inputs.json
          python -c "import json; a=json.load(open('run/readout_inputs.json')); b=json.load(open('data/readout_inputs.json')); a.pop('parser'); b.pop('parser'); assert a == b"
