name: Published-method diagnostic

on:
  push:
    branches: [research/global-patch-certificates]
    paths:
      - 'evaluation/run_proseg_locked.py'
      - '.github/workflows/proseg-locked.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proseg:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data reader
        run: python -m pip install pyarrow pandas
      - name: Build the published Proseg version
        run: |
          mkdir -p results/proseg_locked
          rustup update stable
          rustup default stable
          rustc --version | tee results/proseg_locked/rust_version.txt
          cargo install --locked --version 3.2.0 --bin proseg --jobs 2 proseg 2>&1 | tee results/proseg_locked/build.log
      - name: Run fixed protocol
        run: python evaluation/run_proseg_locked.py
      - name: Preserve outputs and failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/proseg_locked
          if ! git diff --cached --quiet; then
            git commit -m 'Record Proseg diagnostic outputs and execution status'
            git push origin HEAD:research/global-patch-certificates
          fi
